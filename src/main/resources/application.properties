# HTTP
# quarkus.http.port=8080

# OIDC / Keycloak – set up for development purposes
# quarkus.oidc.auth-server-url=http://localhost:8080/realms/glow-realm
# quarkus.oidc.client-id=glow-payment-service
# quarkus.oidc.credentials.secret=<your-client-secret>
    # The client secret can be found in the Keycloak admin console under:
    # glow-realm > Clients > glow-payment-service > Credentials -> Client Secret

# Datasource – PostgreSQL
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=glow
# quarkus.datasource.password=glow

# Hibernate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.log.sql=true

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog.sql
quarkus.hibernate-orm.schema-management.strategy=none

# Stripe
glow.payment.stripe.base-url=${STRIPE_BASE_URL:http://stripe-mock:12111}
glow.payment.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_fake}
glow.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_fake}

